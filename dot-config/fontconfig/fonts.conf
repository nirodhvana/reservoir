<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

<alias>
          <family>NerdFonts</family>
          <prefer>
               <family>Iosevka</family>
               <family>GohuFont11NerdFontMono-Regular</family>
               <family>FontAwesome</family>
          </prefer>
</alias>

<alias>
		<family>monospace</family>
		<prefer>
			<family>GohuFont11NerdFontMono-Regular</family>
			<family>FontAwesome</family>
		</prefer>
</alias>

<alias>
		<family>Annapurna SIL</family>
		<prefer>
			<family>AnnapurnaSIL-Regular</family>
			<family>AnnapurnaSIL-Bold</family>
		</prefer>
</alias>

</fontconfig>

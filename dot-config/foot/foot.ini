[main]
#font=Iosevka Nerd Font Propo:size=25
font=GohuFontuni11NerdFontPropo-Regular:size=10:antialias=true:autohint=true

[mouse]
hide-when-typing=yes

[cursor]
unfocused-style=hollow
blink=yes

[key-bindings]
scrollback-up-page=Control+k
scrollback-down-page=Control+j

[scrollback]
lines=16384
indicator-position=none

[colors-dark]
alpha=0.9
foreground = 6d8d5f
background = 090604

regular0 = 090604
regular1 = D36105
regular2 = a5995e
regular3 = e6a635
regular4 = 18857e
regular5 = aa9ec1
regular6 = 57758C
regular7 = c1c0c0

bright0 = 9f6d4e
bright1 = C9372A
bright2 = 6d8d5f
bright3 = C0A552
bright4 = 2e5d66
bright5 = 7f7690
bright6 = 1DA3C0
bright7 = 918686
